services:
  studio:
    build: .
    image: animode-fun-dub:2.1
    ports: ["127.0.0.1:7860:7860"]
    env_file: .env
    environment:
      ANIMODE_UI_HOST: 0.0.0.0
      ANIMODE_DEVICE: cpu
      DEMUCS_PYTHON: /opt/demucs/bin/python
      HF_HOME: /app/model_cache
      FISH_TTS_URL: ${FISH_CONTAINER_TTS_URL:-http://host.docker.internal:8080/v1/tts}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["studio-data:/app/outputs", "model-cache:/app/model_cache"]
    restart: unless-stopped
  api:
    profiles: ["api"]
    build: .
    image: animode-fun-dub:2.1
    command: ["python", "-m", "animode.api"]
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    environment:
      ANIMODE_API_HOST: 0.0.0.0
      ANIMODE_API_ROOT: /app/api_data
      ANIMODE_DEVICE: cpu
      DEMUCS_PYTHON: /opt/demucs/bin/python
      HF_HOME: /app/model_cache
      FISH_TTS_URL: ${FISH_CONTAINER_TTS_URL:-http://host.docker.internal:8080/v1/tts}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["api-data:/app/api_data", "model-cache:/app/model_cache"]
    restart: unless-stopped
volumes:
  studio-data:
  api-data:
  model-cache:
