[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "animode-fun-dub"
version = "2.1.0"
description = "Multi-character Hindi dubbing with pyannote and Fish Speech"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dynamic = ["dependencies"]
authors = [{name = "Animode Fun DUB"}]
maintainers = [{name = "Animode Fun DUB"}]
keywords = ["hindi", "anime", "dubbing", "diarization", "voice-cloning", "asr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
animode-dub = "dub_video:main"
animode-ui = "animode.webui:main"
animode-api = "animode.api:main"
animode-check = "animode.preflight:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["animode*", "scripts*"]

[tool.setuptools]
py-modules = ["dub_video"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-animode.txt"]}

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
